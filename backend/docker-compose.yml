        #     interval: 5s
        #     timeout: 5s
        #     retries: 5
        # networks:
        #     - petalia-network

    redis:
        image: redis:8-alpine
        container_name: petalia-redis
        # restart: unless-stopped
        ports:
            - "6379:6379"
